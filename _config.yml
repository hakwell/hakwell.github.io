collections:
  writeups:
    output: true
    permalink: /writeups/:name/
  faith:
    output: true
    permalink: /faith/:name/

# Override the default layout for each Markdown collection.
defaults:
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: article
      author: "Isezerano Brice Fiquerite"
  - scope:
      path: ""
      type: "faith"
    values:
      layout: article
      author: "Isezerano Brice Fiquerite"
